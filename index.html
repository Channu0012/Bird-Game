<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050b17" />
    <meta name="title" content="BirdMate 3D Arcade — Premium 3D Mini-Game Platform" />
    <meta name="description"
        content="Play 10 stylized 3D arcade games on BirdMate! Sky Rush, Neon Run, Ball Fall, Hole Chaos, Mob Strike, Bridge Blaze, Gravity Flip, Rooftop Escape, Crash Arena, Boss Rush." />
    <meta name="keywords" content="BirdMate 3D, WebGL games, 3D arcade, hyper casual, Three.js games, runner, sky rush, mob strike" />
    <meta name="author" content="Channu" />
    <meta property="og:title" content="BirdMate 3D Arcade — Premium 3D Mini-Game Platform" />
    <meta property="og:description" content="Play 10 stylized 3D arcade games on BirdMate! Play, compete, set records, and repeat!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://raw.githubusercontent.com/Channu0012/Bird-Game/main/logo.png" />
    <meta property="og:url" content="https://birdmate.netlify.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BirdMate 3D Arcade" />
    <meta name="twitter:description" content="Play 10 stylized 3D arcade games on BirdMate 3D!" />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/Channu0012/Bird-Game/main/logo.png" />
    <title>BirdMate 3D Arcade — Premium Browser Games</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <!-- THREE.JS WEBGL 3D ENGINE CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <div class="page-shell">
        <!-- PLATFORM HEADER -->
        <header class="topbar">
            <div class="topbar-left">
                <a href="#" class="brand-wrap nav-link" data-view="home" aria-label="BirdMate Home">
                    <span class="brand-badge">🎮</span>
                    <span class="brand-title">BirdMate <small class="brand-tag">3D ARCADE</small></span>
                </a>
                <nav class="nav-links">
                    <a href="#" class="nav-link active" data-view="home">Home</a>
                    <a href="#" class="nav-link" data-view="games">3D Games</a>
                    <a href="#" class="nav-link" data-view="profile">Profile</a>
                </nav>
            </div>

            <div class="topbar-right">
                <div class="header-search-wrap">
                    <input id="headerSearch" type="text" placeholder="Search 3D games..." aria-label="Search 3D games" />
                </div>

                <div class="graphics-selector-wrap" title="Adaptive Graphics Quality">
                    <select id="gfxSelect" class="gfx-select" aria-label="Graphics Quality">
                        <option value="HIGH">✨ HIGH 3D</option>
                        <option value="MEDIUM" selected>⚡ MED 3D</option>
                        <option value="LOW">🔋 LOW 3D</option>
                    </select>
                </div>

                <div id="hudControls" class="hud-controls" style="display: none;">
                    <span id="gameTitleHud" class="game-title-hud">Playing</span>
                    <button id="pauseButton" class="pause-button" type="button" aria-label="Pause game">Pause</button>
                </div>

                <button id="soundToggle" class="sound-toggle" type="button" aria-label="Toggle sound" aria-pressed="false" title="Toggle Sound">
                    🔊
                </button>
            </div>
        </header>

        <!-- PLATFORM VIEW CONTAINER (HOME / CATALOG / PROFILE) -->
        <main id="viewContainer" class="view-container"></main>

        <!-- ACTIVE 3D GAME PLAYING VIEW -->
        <div id="playingCard" class="game-card" style="display: none;">
            <canvas id="gameCanvas" width="900" height="620" aria-label="BirdMate 3D gameplay canvas"></canvas>
        </div>

        <!-- RESULT MODAL OVERLAY -->
        <div id="resultModal" class="overlay" aria-modal="true" role="dialog"></div>

        <!-- TOAST NOTIFICATION CONTAINER -->
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <!-- MAIN PLATFORM & 3D GAMES ENGINE SCRIPT -->
    <script src="script.js"></script>
</body>

</html>
