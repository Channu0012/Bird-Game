<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Crazy Bird - Flappy Style Arcade Game" />
    <meta name="description"
        content="Play Crazy Bird, a fast and colorful arcade flying game with smooth controls, score tracking, and a neon sky world." />
    <meta name="keywords" content="Crazy Bird, arcade game, flappy game, browser game, flying game" />
    <meta name="author" content="Channu" />
    <meta property="og:title" content="Crazy Bird" />
    <meta property="og:description" content="A colorful arcade flying game built for fun and browser play." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://raw.githubusercontent.com/Channu0012/Bird-Game/main/logo.png" />
    <meta property="og:url" content="https://channu0012.github.io/Bird-Game/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crazy Bird" />
    <meta name="twitter:description" content="Fly the bird, dodge the pipes, and chase a new high score." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/Channu0012/Bird-Game/main/logo.png" />
    <title>Crazy Bird</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">Crazy Bird</div>
            <div class="hud">
                <span>Score: <strong id="score">0</strong></span>
                <span>Best: <strong id="best">0</strong></span>
            </div>
        </header>

        <main class="game-card">
            <canvas id="gameCanvas" width="900" height="620" aria-label="Crazy Bird game"></canvas>
            <div id="overlay" class="overlay visible">
                <div class="panel">
                    <h1>Crazy Bird</h1>
                    <p>Press space or click to flap</p>
                    <button id="startButton">Play</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
