<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050b17" />
    <meta name="title" content="BirdMate 2.0 — Crazy Mini-Game Playground" />
    <meta name="description"
        content="Play 10 fast, addictive mini-games on BirdMate! Crazy Bird, Tap Rush, Brain Trap, Dodge It, Perfect Hit, Stack Master, Bomb Run, Color Chaos, Run Till Dead, Memory Blitz." />
    <meta name="keywords" content="BirdMate, Crazy Bird, mini games, arcade platform, browser games, tap rush, stack master, brain trap" />
    <meta name="author" content="Channu" />
    <meta property="og:title" content="BirdMate 2.0 — Crazy Mini-Game Playground" />
    <meta property="og:description" content="Play 10 fast, addictive mini-games on BirdMate! Play, compete, set records, and repeat!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://raw.githubusercontent.com/Channu0012/Bird-Game/main/logo.png" />
    <meta property="og:url" content="https://birdmate.netlify.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BirdMate 2.0 Mini-Games" />
    <meta name="twitter:description" content="Play 10 fast, addictive mini-games on BirdMate!" />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/Channu0012/Bird-Game/main/logo.png" />
    <title>BirdMate 2.0 — Crazy Mini-Game Platform</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="page-shell">
        <!-- PLATFORM HEADER -->
        <header class="topbar">
            <div class="topbar-left">
                <a href="#" class="brand-wrap nav-link" data-view="home" aria-label="BirdMate Home">
                    <span class="brand-badge">🐤</span>
                    <span class="brand-title">BirdMate</span>
                </a>
                <nav class="nav-links">
                    <a href="#" class="nav-link active" data-view="home">Home</a>
                    <a href="#" class="nav-link" data-view="games">Games</a>
                    <a href="#" class="nav-link" data-view="profile">Profile</a>
                </nav>
            </div>

            <div class="topbar-right">
                <div class="header-search-wrap">
                    <input id="headerSearch" type="text" placeholder="Search games..." aria-label="Search games" />
                </div>

                <div id="hudControls" class="hud-controls" style="display: none;">
                    <span id="gameTitleHud" class="game-title-hud">Playing</span>
                    <button id="pauseButton" class="pause-button" type="button" aria-label="Pause game">Pause</button>
                </div>

                <button id="soundToggle" class="sound-toggle" type="button" aria-label="Toggle sound" aria-pressed="false" title="Toggle Sound">
                    🔊
                </button>
            </div>
        </header>

        <!-- PLATFORM VIEW CONTAINER (HOME / CATALOG / PROFILE) -->
        <main id="viewContainer" class="view-container"></main>

        <!-- ACTIVE GAME PLAYING VIEW -->
        <div id="playingCard" class="game-card" style="display: none;">
            <canvas id="gameCanvas" width="900" height="620" aria-label="BirdMate gameplay canvas"></canvas>
        </div>

        <!-- RESULT MODAL OVERLAY -->
        <div id="resultModal" class="overlay" aria-modal="true" role="dialog"></div>

        <!-- TOAST NOTIFICATION CONTAINER -->
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <!-- CONSOLIDATED PLATFORM & ENGINE SCRIPT -->
    <script src="script.js"></script>
</body>

</html>
